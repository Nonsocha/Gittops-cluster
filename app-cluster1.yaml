apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-cluster1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nonsocha/Gittops-cluster.git
    targetRevision: HEAD
    path: service-a
  destination:
    server: https://kubernetes.default.svc   # cluster1
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true